[theme]
base = "light"
primaryColor = "#245B3A"
backgroundColor = "#F8F7F2"
secondaryBackgroundColor = "#EDF2EA"
codeBackgroundColor = "#E5ECE2"
textColor = "#1E2A23"
linkColor = "#176B87"
borderColor = "#D5E0D1"
font = "DM Sans:https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap"
headingFont = "DM Serif Display:https://fonts.googleapis.com/css2?family=DM+Serif+Display&display=swap"
baseFontSize = 16
headingFontSizes = ["42px", "30px", "23px", "18px", "16px", "14px"]
headingFontWeights = [400, 400, 500, 600, 600, 600]
baseRadius = "medium"
buttonRadius = "medium"
showWidgetBorder = true
showSidebarBorder = false
linkUnderline = false
chartCategoricalColors = ["#245B3A", "#176B87", "#C57735", "#7867A7", "#B4473F", "#7D9060"]

[theme.sidebar]
backgroundColor = "#173B2A"
secondaryBackgroundColor = "#214B35"
textColor = "#F5F4EE"
primaryColor = "#D3B76B"
borderColor = "#356148"

[server]
headless = true
enableCORS = true
enableXsrfProtection = true

[browser]
gatherUsageStats = false
